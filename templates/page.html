<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ec">
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <title>{{title}}</title>
  <script src="/assets/app.js" defer></script>
</head>
<body data-page="{{page}}">
<a class="skip" href="#main">Skip to content</a>
<div class="site-shell">
  <header class="site-header">
    <a class="brand" href="/" aria-label="nevip's lounge home"><span class="brand-symbol" aria-hidden="true">l<span>•</span></span><span>nevip<span class="brand-apostrophe">’s</span> lounge<span class="brand-dot">.</span></span></a>
    <nav aria-label="Main navigation"><a href="/" {{home_current}}>The lounge</a><a href="/switch" {{switch_current}}>Nintendo Switch <span aria-hidden="true">↗</span></a></nav>
    <button class="theme-button" aria-label="Switch to dark mode" title="Change the lighting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/></svg></button>
  </header>
  <main id="main">{{content}}</main>
  <footer><span>A little corner of the internet. <span class="footer-flower" aria-hidden="true">✳</span></span><span>Made for good company <span aria-hidden="true">↗</span><small>v{{version}}</small></span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
