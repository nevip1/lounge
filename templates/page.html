<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b38ae4">
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{social_title}}">
  <meta property="og:description" content="{{social_description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  {{social_image_meta}}
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <title>{{title}}</title>
  <script src="/assets/app.js" defer></script>
</head>
<body data-page="{{page}}">
<a class="skip" href="#main">Skip to content</a>
<div class="site-shell">
  <header class="site-header">
    <a class="brand" href="/" aria-label="Lounge home"><span aria-hidden="true">✳</span> lounge<span class="brand-slash">/</span></a>
    <button class="theme-button" aria-label="Switch to dark mode" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/></svg></button>
  </header>
  <main id="main">{{content}}</main>
  <footer><a href="/">nevip’s lounge</a><span>v{{version}} <span class="footer-star" aria-hidden="true">✧</span></span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
