<a class="back-link" href="/">← all links</a>
<section class="profile switch-profile" aria-labelledby="switch-title">
  <div class="switch-sticker" aria-hidden="true"><svg viewBox="0 0 80 58" fill="none"><rect x="4" y="5" width="72" height="48" rx="15" fill="var(--accent)"/><rect x="20" y="10" width="40" height="38" rx="5" fill="var(--screen)"/><path d="M11 19h7m-3.5-3.5v7M66 34h.1m4-6h.1" stroke="var(--button-ink)" stroke-width="2.5" stroke-linecap="round"/><path d="M33 24v4m14-4v4m-12 7q5 4 10 0" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg><span>✧</span></div>
  <h1 id="switch-title">add me on switch<span class="name-dot">.</span></h1>
  <p>{{name}} <span aria-hidden="true">/</span> Nintendo Switch</p>
</section>
<section class="friend-card" aria-label="My Switch friend code">
  <label for="friend-code">friend code</label>
  <div class="code-row"><input id="friend-code" value="{{friend_code}}" readonly aria-label="Nintendo Switch friend code" spellcheck="false"><button class="copy-button" id="copy-code" {{code_disabled}} aria-label="Copy friend code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="3"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg></button></div>
  {{friend_action}}
</section>
<a class="link-card app-link" href="{{app_url}}" target="_blank" rel="noopener noreferrer"><span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg></span><span class="link-copy"><strong>Nintendo Switch app</strong><span>need the app?</span></span><span class="link-arrow" aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
